{% extends "base.html" %}

{% block ogp %}
<meta property="og:url" content="{{ current_url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:site_name" content="{{ config.title }}">
<meta property="og:image" content="{{ get_url(path="favicons/android-chrome-512x512.png") }}">
{% endblock %}

{% block content %}
<div class="reading-progress" role="progressbar" aria-label="記事の読書進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

<h2>{{ page.title }}</h2>

<p><strong>{{ page.date }}</strong></p>

<div data-reading-content>
  {{ page.content | safe }}
</div>

{% endblock content %}

{% block sidemenu %}


<p><a href="{{ get_url(path = "@/blog/_index.md") }}">記事一覧へ戻る</a></p>

{% endblock %}

{% block scripts %}
<script src="{{ get_url(path="reading-progress.js") }}" defer></script>
{% endblock %}
